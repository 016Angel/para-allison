<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuestro cielo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cielo-1: #050816;
    --cielo-2: #0d1336;
    --cielo-3: #2a1745;
    --estrella: #fff6d5;
    --rosa: #ff8fb8;
    --texto: #f5f0ff;
    --tarjeta: rgba(20, 16, 48, 0.82);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--cielo-1);
    color: var(--texto);
    font-family: 'Quicksand', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }

  /* El "mundo" mide dos pantallas: cielo arriba, horizonte abajo.
     Al abrir, la cámara empieza viendo el horizonte y sube al cielo. */
  #mundo {
    position: fixed; left: 0; top: 0; width: 100%;
    background: linear-gradient(to bottom,
      var(--cielo-1) 0%, var(--cielo-2) 35%, var(--cielo-3) 70%, #6b2d5e 86%, #2a1430 100%);
    will-change: transform;
  }
  canvas#fondo { position: absolute; inset: 0; width: 100%; height: 100%; }
  #paisaje { position: absolute; left: 0; bottom: 0; width: 100%; height: max(30vw, 18vh); }

  /* Pantalla de inicio */
  #inicio {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 24px 16px; gap: 18px; z-index: 20;
    opacity: 0; pointer-events: none;
    transition: opacity 1.2s ease;
  }
  #inicio.listo { opacity: 1; pointer-events: auto; }
  #inicio.oculto { opacity: 0; pointer-events: none; }
  h1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.6rem, 9vw, 4.5rem);
    text-shadow: 0 0 18px rgba(255, 143, 184, 0.6);
  }
  #apodo { display: inline-block; color: var(--rosa); transition: opacity 0.5s, transform 0.5s; }
  #apodo.cambiando { opacity: 0; transform: translateY(-8px); }
  #inicio p { font-size: clamp(1rem, 3.6vw, 1.2rem); opacity: 0.85; max-width: 420px; line-height: 1.5; }
  button.boton {
    margin-top: 8px; padding: 14px 30px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.35);
    background: rgba(255, 143, 184, 0.18); color: var(--texto); font: 600 1.05rem 'Quicksand', sans-serif;
    cursor: pointer; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    animation: latido 2.2s ease-in-out infinite;
  }
  button.boton:hover { background: rgba(255, 143, 184, 0.32); }
  @keyframes latido { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }

  /* Contador */
  #contador {
    position: fixed; top: 18px; left: 50%; transform: translateX(-50%);
    font-size: 0.95rem; opacity: 0; transition: opacity 1s; z-index: 5;
    background: rgba(255,255,255,0.08); padding: 6px 16px; border-radius: 999px;
    white-space: nowrap;
  }
  #contador.visible { opacity: 0.9; }

  /* Estrellas que se pueden tocar */
  .estrella {
    position: fixed; width: 44px; height: 44px; margin: -22px 0 0 -22px;
    border: none; background: none; cursor: pointer; z-index: 6;
    opacity: 0; transform: scale(0.3);
    transition: opacity 1s ease, transform 0.6s ease, left 2.4s cubic-bezier(.6,0,.3,1), top 2.4s cubic-bezier(.6,0,.3,1);
  }
  .estrella.visible { opacity: 1; transform: scale(1); }
  .estrella::before {
    content: ''; position: absolute; inset: 0; margin: auto; width: 26px; height: 26px;
    background: var(--estrella);
    clip-path: polygon(50% 0%, 61% 38%, 100% 50%, 61% 62%, 50% 100%, 39% 62%, 0% 50%, 39% 38%);
    filter: drop-shadow(0 0 6px var(--estrella));
    animation: brillo 2.4s ease-in-out infinite;
    animation-delay: var(--retraso, 0s);
  }
  .estrella::after {
    content: ''; position: absolute; inset: 8px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,246,213,0.45), transparent 70%);
  }
  .estrella.vista::before { background: var(--rosa); filter: drop-shadow(0 0 8px var(--rosa)); }
  .estrella.vista::after { background: radial-gradient(circle, rgba(255,143,184,0.5), transparent 70%); }
  .estrella:hover::before { transform: scale(1.25); }
  @keyframes brillo {
    0%,100% { transform: scale(1) rotate(0deg); opacity: 1; }
    50% { transform: scale(0.75) rotate(20deg); opacity: 0.7; }
  }

  /* Tarjeta con la razón */
  #velo {
    position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
    padding: 16px; background: rgba(5, 8, 22, 0.45);
    opacity: 0; pointer-events: none; transition: opacity 0.4s;
  }
  #velo.abierto { opacity: 1; pointer-events: auto; }
  #tarjeta {
    background: var(--tarjeta); border: 1px solid rgba(255, 143, 184, 0.35);
    border-radius: 22px; padding: 30px 26px 22px; max-width: 380px; width: 100%; text-align: center;
    box-shadow: 0 0 40px rgba(255, 143, 184, 0.25); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    transform: translateY(16px) scale(0.96); transition: transform 0.4s;
  }
  #velo.abierto #tarjeta { transform: none; }
  #tarjeta .numero { font-size: 0.85rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--rosa); }
  #tarjeta .razon { font-family: 'Dancing Script', cursive; font-size: clamp(1.6rem, 6vw, 2rem); margin: 12px 0 18px; line-height: 1.3; }
  #tarjeta .cerrar { font-size: 0.85rem; opacity: 0.6; }

  /* Final */
  svg#constelacion { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; }
  svg#constelacion polyline {
    fill: none; stroke: var(--rosa); stroke-width: 1.5; stroke-linejoin: round;
    filter: drop-shadow(0 0 4px var(--rosa)); opacity: 0.8;
  }
  #final {
    position: fixed; left: 0; right: 0; bottom: 5vh; text-align: center; padding: 0 16px; z-index: 7;
    opacity: 0; transition: opacity 2s; pointer-events: none;
  }
  #final.visible { opacity: 1; }
  #final h2 { font-family: 'Dancing Script', cursive; font-size: clamp(2.2rem, 8vw, 3.6rem); text-shadow: 0 0 20px rgba(255,143,184,0.7); }
  #final p {
    margin-top: 4px; font-size: clamp(0.95rem, 3.5vw, 1.15rem); max-width: 480px; margin-inline: auto; line-height: 1.5;
    opacity: 0; transform: translateY(6px); transition: opacity 1.4s, transform 1.4s;
  }
  #final.visible p { opacity: 0.92; transform: none; }
</style>
</head>
<body>

<div id="mundo">
  <canvas id="fondo"></canvas>
  <svg id="paisaje" viewBox="0 0 1000 300" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
    <!-- cerros de atrás -->
    <path fill="#24122f" d="M0,170 C140,120 260,150 400,125 C540,100 680,140 820,115 C900,102 960,110 1000,105 L1000,300 L0,300Z"/>
    <!-- cerros de enfrente -->
    <path fill="#0c0714" d="M0,235 C160,200 300,225 470,210 C640,195 780,230 1000,200 L1000,300 L0,300Z"/>
    <!-- pinos -->
    <g fill="#0c0714">
      <polygon points="150,226 175,144 200,226"/><polygon points="158,194 175,124 192,194"/>
      <polygon points="215,222 233,170 251,222"/>
      <polygon points="770,226 795,140 820,226"/><polygon points="778,190 795,118 812,190"/>
      <polygon points="835,220 855,165 875,220"/>
      <polygon points="700,222 722,150 744,222"/><polygon points="707,188 722,128 737,188"/>
    </g>
  </svg>
</div>
<svg id="constelacion"><polyline id="linea" points=""/></svg>

<div id="inicio">
  <h1 id="titulo"></h1>
  <p id="subtitulo"></p>
  <button class="boton" id="empezar">Mirar el cielo ✨</button>
</div>

<div id="contador"></div>

<div id="velo">
  <div id="tarjeta">
    <div class="numero" id="numero"></div>
    <div class="razon" id="razon"></div>
    <div class="cerrar">toca para seguir buscando</div>
  </div>
</div>

<div id="final">
  <h2 id="finalTitulo"></h2>
  <div id="finalTexto"></div>
</div>

<script>
// ✏️ ======== PERSONALIZA AQUÍ ========
const APODOS = ["Ali", "Allison", "mi niña", "mi hermosa", "mi preciosa"];
const SUBTITULO = "Sé que no siempre hice las cosas bien, y te pido perdón. Escondí en este cielo algunas de las razones por las que te amo, para que nunca lo dudes. Toca cada estrella para descubrirlas.";
const RAZONES = [
  "Tu forma de ser. Así, tal cual eres, es como te amo.",
  "Me encanta abrazarte. Ahí siento que todo está en su lugar.",
  "Que me andes regañando siempre… porque sé que es tu forma de cuidarme.",
  "Te amo hasta enojada. Bueno, enojada te amo más, te ves bien bonita.",
  "Que estés conmigo. No sabes lo afortunado que me siento.",
  "Tu sonrisa. Me la quedo viendo como menso y no puedo evitarlo.",
  "Tus ojitos hermosos, en los que me pierdo cada vez que me miras.",
  "Que volvimos a hablar. Neta, me hacías mucha falta.",
  "Porque por ti quiero ser mejor cada día, y lo voy a demostrar."
];
const FINAL_TITULO = "Te amo, Ali";
// Cada línea aparece una después de otra
const FINAL_TEXTO = [
  "Perdóname por las veces que te fallé.",
  "Antes te miraba guapa.",
  "Hoy te miro hermosa.",
  "Y te seguiré viendo preciosa, perdidamente y para siempre. ♡"
];
// ===================================

// El título va cambiando entre sus apodos
const titulo = document.getElementById('titulo');
titulo.textContent = 'Para ti, ';
const apodo = document.createElement('span');
apodo.id = 'apodo';
apodo.textContent = APODOS[0];
titulo.appendChild(apodo);
let apodoActual = 0;
setInterval(() => {
  apodo.classList.add('cambiando');
  setTimeout(() => {
    apodoActual = (apodoActual + 1) % APODOS.length;
    apodo.textContent = APODOS[apodoActual];
    apodo.classList.remove('cambiando');
  }, 500);
}, 2200);
document.getElementById('subtitulo').textContent = SUBTITULO;
document.getElementById('finalTitulo').textContent = FINAL_TITULO;
const finalTexto = document.getElementById('finalTexto');
FINAL_TEXTO.forEach((linea, i) => {
  const p = document.createElement('p');
  p.textContent = linea;
  p.style.transitionDelay = `${1.5 + i * 1.8}s`;
  finalTexto.appendChild(p);
});

/* ---------- Fondo: estrellas titilando y estrellas fugaces ---------- */
const mundo = document.getElementById('mundo');
const canvas = document.getElementById('fondo');
const ctx = canvas.getContext('2d');
let W, H, dpr, fondo = [], fugaces = [];

// El canvas cubre todo el mundo (dos pantallas de alto)
function redimensionar() {
  dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  mundo.style.height = (H * 2) + 'px';
  canvas.width = W * dpr; canvas.height = H * 2 * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const n = Math.round(W * H * 2 / 2600);
  fondo = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H * 1.8,
    r: Math.random() * 1.2 + 0.2,
    fase: Math.random() * Math.PI * 2,
    vel: Math.random() * 0.02 + 0.005
  }));
}
// En iPhone la barra de Safari cambia el alto al hacer scroll; solo reacomodamos si cambia el ancho
// (por ejemplo, al girar el celular)
window.addEventListener('resize', () => {
  if (window.innerWidth === W) return;
  redimensionar(); recolocar();
});
redimensionar();

function dibujar() {
  ctx.clearRect(0, 0, W, H * 2);
  for (const s of fondo) {
    s.fase += s.vel;
    ctx.globalAlpha = 0.35 + Math.sin(s.fase) * 0.35 + 0.3;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
  }
  if (Math.random() < 0.004) {
    fugaces.push({ x: Math.random() * W * 0.8 + W * 0.2, y: Math.random() * H * 0.4, vida: 1 });
  }
  for (const f of fugaces) {
    const largo = 90;
    const g = ctx.createLinearGradient(f.x, f.y, f.x + largo, f.y - largo * 0.45);
    g.addColorStop(0, `rgba(255,255,255,${f.vida})`);
    g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = 1; ctx.strokeStyle = g; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x + largo, f.y - largo * 0.45); ctx.stroke();
    f.x -= 9; f.y += 4; f.vida -= 0.02;
  }
  fugaces = fugaces.filter(f => f.vida > 0);
  ctx.globalAlpha = 1;
  requestAnimationFrame(dibujar);
}
dibujar();

// Al abrir: la cámara ve el horizonte y luego sube al cielo
mundo.style.transform = `translateY(${-H}px)`;
setTimeout(() => {
  mundo.style.transition = 'transform 5s cubic-bezier(.45,0,.2,1)';
  mundo.style.transform = 'translateY(0)';
}, 900);
setTimeout(() => document.getElementById('inicio').classList.add('listo'), 5200);

/* ---------- Estrellas con razones ---------- */
const contador = document.getElementById('contador');
const velo = document.getElementById('velo');
let estrellas = [], vistas = 0, terminado = false;

// Posiciones aleatorias (en %) que no se encimen
function posicionesAleatorias(n) {
  const pos = [];
  let intentos = 0;
  while (pos.length < n && intentos < 5000) {
    intentos++;
    const p = { x: 8 + Math.random() * 84, y: 14 + Math.random() * 74 };
    const lejos = pos.every(q => Math.hypot((p.x - q.x) * W / 100, (p.y - q.y) * H / 100) > 70);
    if (lejos || intentos > 4000) pos.push(p);
  }
  return pos;
}

function crearEstrellas() {
  const pos = posicionesAleatorias(RAZONES.length);
  RAZONES.forEach((razon, i) => {
    const b = document.createElement('button');
    b.className = 'estrella';
    b.setAttribute('aria-label', `Estrella ${i + 1}`);
    b.style.setProperty('--retraso', `${Math.random() * 2}s`);
    b.dataset.x = pos[i].x; b.dataset.y = pos[i].y;
    b.style.left = pos[i].x + '%'; b.style.top = pos[i].y + '%';
    b.addEventListener('click', () => abrir(i, b));
    document.body.appendChild(b);
    estrellas.push(b);
    setTimeout(() => b.classList.add('visible'), 300 + i * 180);
  });
  actualizarContador();
}

function actualizarContador() {
  contador.textContent = `✨ ${vistas} de ${RAZONES.length} estrellas`;
}

function abrir(i, b) {
  if (terminado) return;
  if (!b.classList.contains('vista')) {
    b.classList.add('vista'); vistas++; actualizarContador();
  }
  document.getElementById('numero').textContent = `Razón #${i + 1} · ${APODOS[i % APODOS.length]}`;
  document.getElementById('razon').textContent = RAZONES[i];
  velo.classList.add('abierto');
}

velo.addEventListener('click', () => {
  velo.classList.remove('abierto');
  if (vistas === RAZONES.length && !terminado) setTimeout(formarCorazon, 600);
});

/* ---------- Final: las estrellas forman un corazón ---------- */
function puntosCorazon(n) {
  // El corazón ocupa la parte de arriba; abajo queda espacio para el mensaje
  const tam = Math.min(W * 0.75 / 32, H * 0.4 / 29);
  const cx = W / 2, cy = H * 0.5 - 17 * tam;
  const punto = t => ({
    x: cx + 16 * Math.sin(t) ** 3 * tam,
    y: cy - (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) * tam
  });
  // Reparte los puntos a la misma distancia sobre la línea, empezando en la punta de abajo,
  // para que ninguna estrella quede encimada
  const muestras = 600, curva = [], acum = [0];
  for (let i = 0; i <= muestras; i++) curva.push(punto(Math.PI + (i / muestras) * Math.PI * 2));
  for (let i = 1; i <= muestras; i++) {
    acum.push(acum[i - 1] + Math.hypot(curva[i].x - curva[i - 1].x, curva[i].y - curva[i - 1].y));
  }
  const total = acum[muestras];
  const pts = [];
  let j = 0;
  for (let k = 0; k < n; k++) {
    const meta = (k / n) * total;
    while (acum[j] < meta) j++;
    pts.push(curva[j]);
  }
  return pts;
}

function formarCorazon() {
  terminado = true;
  contador.classList.remove('visible');
  const pts = puntosCorazon(estrellas.length);
  estrellas.forEach((b, i) => { b.style.left = pts[i].x + 'px'; b.style.top = pts[i].y + 'px'; b.style.cursor = 'default'; });
  setTimeout(dibujarLinea, 2500);
}

function dibujarLinea() {
  // La línea usa muchos puntos para que el corazón se vea suave
  const pts = puntosCorazon(80);
  pts.push(pts[0]);
  const linea = document.getElementById('linea');
  linea.setAttribute('points', pts.map(p => `${p.x},${p.y}`).join(' '));
  const largo = linea.getTotalLength();
  linea.style.transition = 'none';
  linea.style.strokeDasharray = largo;
  linea.style.strokeDashoffset = largo;
  linea.getBoundingClientRect();
  linea.style.transition = 'stroke-dashoffset 3s ease-in-out';
  linea.style.strokeDashoffset = 0;
  setTimeout(() => document.getElementById('final').classList.add('visible'), 2200);
}

// Si cambia el tamaño de la pantalla, reacomoda
function recolocar() {
  if (!terminado) return;
  const pts = puntosCorazon(estrellas.length);
  estrellas.forEach((b, i) => { b.style.left = pts[i].x + 'px'; b.style.top = pts[i].y + 'px'; });
  const linea = document.getElementById('linea');
  const suave = puntosCorazon(80);
  suave.push(suave[0]);
  linea.style.transition = 'none';
  linea.style.strokeDasharray = 'none';
  linea.setAttribute('points', suave.map(p => `${p.x},${p.y}`).join(' '));
}

document.getElementById('empezar').addEventListener('click', () => {
  document.getElementById('inicio').classList.add('oculto');
  contador.classList.add('visible');
  crearEstrellas();
});
</script>
</body>
</html>
